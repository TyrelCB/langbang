[project]
name = "langbang"
version = "0.1.0"
description = "Agentic chat server: LangGraph + LangChain + MCP, llama.cpp-style web UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-mcp-adapters>=0.1",
    "langsmith>=0.1",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "deepagents>=0.7.14",
    "gtts>=2.5",
    "speechrecognition>=3.10",
]

[project.optional-dependencies]
# Only needed when CONFIG switches a voice provider to "gcloud" (voice.py
# lazy-imports these; keyless gtts/sr paths need nothing extra).
voice-gcloud = [
    "google-cloud-texttospeech>=2.16",
    "google-cloud-speech>=2.27",
]

[tool.uv]
package = false
