[project]
name = "langbang"
version = "0.1.0"
description = "Agentic chat server: LangGraph + LangChain + MCP, llama.cpp-style web UI"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-mcp-adapters>=0.1",
    "langsmith>=0.1",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "deepagents>=0.7.14",
    "gtts>=2.5",
    "speechrecognition>=3.10",
    "croniter>=6.2.4",
    "torch>=2.5",
    "pocket-tts>=3.3",
    "faster-whisper>=1.2.1",
]

[project.optional-dependencies]
# Only needed when CONFIG switches a voice provider to "gcloud" (voice.py
# lazy-imports these; keyless gtts/sr paths need nothing extra).
voice-gcloud = [
    "google-cloud-texttospeech>=2.16",
    "google-cloud-speech>=2.27",
]

[tool.uv]
package = false
# rag node + Laya decision server (dependency groups below) share the app venv; plain
# `uv sync`/`uv add` must keep the groups installed or those services break.
default-groups = ["rag", "decide"]
# gtts pins click<8.2 only for its `gtts-cli` entry point (LangBang never
# calls it); transformers>=5.19 -> huggingface-hub>=1.31 needs click>=8.4.2.
override-dependencies = ["click>=8.4.2"]

# Pocket TTS (local CPU read-aloud) pulls torch: pin it to PyTorch's CPU-only
# wheel index so a sync never drags in multi-GB CUDA builds. explicit=true
# keeps every other package on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
decide = [
    "laya[serve]>=0.4.6",
]
rag = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "librosa>=0.11",
    "numpy>=2.2",
    "pillow>=12",
    "pymupdf>=1.28",
    "python-docx>=1.2",
    "python-multipart>=0.0.20",
    "sentence-transformers>=6.1",
    "torch>=2.5",
    "torchvision>=0.29",
    "transformers>=5.19",
    "uvicorn[standard]>=0.32",
]
