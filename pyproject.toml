[project]
name = "langbang"
version = "0.1.0"
description = "Agentic chat server: LangGraph + LangChain + MCP, llama.cpp-style web UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-mcp-adapters>=0.1",
    "langsmith>=0.1",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.uv]
package = false
