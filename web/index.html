<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LangBang // NETNAVIGATOR</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">LANG<span>BANG</span></div>
    <button id="btn-new" class="btn">+ NEW CHAT</button>
    <div id="threads"></div>
    <div class="sidebar-footer">
      <button id="btn-settings" class="btn ghost">⚙ CONFIG</button>
      <button id="btn-sound" class="btn ghost" title="sound toggle">♪ SOUND: OFF</button>
      <div id="health" class="health">LINK: …</div>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div id="chat-title">— SELECT OR START A CHAT —</div>
      <div id="model-tag"></div>
    </header>
    <div id="chat"></div>
    <footer id="composer">
      <textarea id="input" rows="2" placeholder="Transmit message… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="btn-send" class="btn accent">SEND ▶</button>
    </footer>
  </main>

  <div id="settings-panel" class="hidden">
    <div class="panel-inner">
      <h2>CONFIGURATION</h2>
      <label>Backend URL <input id="set-base_url" type="text"></label>
      <label>Model <input id="set-model" type="text"></label>
      <div class="row">
        <label>Temperature <input id="set-temperature" type="number" step="0.1" min="0" max="2"></label>
        <label>Max tokens <input id="set-max_tokens" type="number" step="256" min="256"></label>
      </div>
      <label>System prompt <textarea id="set-system_prompt" rows="3"></textarea></label>
      <label>MCP servers (JSON) <textarea id="set-mcp" rows="8" spellcheck="false"></textarea></label>
      <div class="row end">
        <button id="btn-cancel" class="btn ghost">CANCEL</button>
        <button id="btn-save" class="btn accent">SAVE</button>
      </div>
      <div id="settings-error" class="error hidden"></div>
    </div>
  </div>
</div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/sfx.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
