<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LangBang // NETNAVIGATOR</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">LANG<span>BANG</span></div>
    <button id="btn-new" class="btn">+ NEW CHAT</button>
    <input id="search" type="text" placeholder="⌕ SEARCH CHATS…" autocomplete="off">
    <div id="threads"></div>
    <div id="search-results" class="hidden"></div>
    <div class="sidebar-footer">
      <button id="btn-settings" class="btn ghost">⚙ CONFIG</button>
      <button id="btn-sound" class="btn ghost" title="sound toggle">♪ SOUND: OFF</button>
      <div id="health" class="health">LINK: …</div>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div id="chat-title">— SELECT OR START A CHAT —</div>
      <div class="topbar-right">
        <button id="btn-game" class="btn ghost" title="X-SIM platformer — G to open, ESC to bail back to chat">⚔ X-SIM</button>
        <button id="btn-reasoning" class="btn ghost" title="Show/hide model reasoning">◈ REASONING: ON</button>
        <div id="ctx-tag" title="Tokens the model re-reads on the next call (post-compaction)"></div>
        <div id="model-tag"></div>
      </div>
    </header>
    <div id="chat"></div>
    <div id="attach-strip"></div>
    <footer id="composer">
      <button id="btn-attach" class="btn ghost hidden" title="Attach image">📎 ATTACH</button>
      <input id="file-img" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple class="hidden">
      <textarea id="input" rows="2" placeholder="Transmit message… (Enter to send, Shift+Enter for newline; paste images when vision is on)"></textarea>
      <button id="btn-send" class="btn accent">SEND ▶</button>
    </footer>
  </main>

  <div id="settings-panel" class="hidden">
    <div class="panel-inner">
      <h2>CONFIGURATION</h2>
      <label>Backend URL <input id="set-base_url" type="text"></label>
      <label>Model <input id="set-model" type="text"></label>
      <div class="row">
        <label>Temperature <input id="set-temperature" type="number" step="0.1" min="0" max="2"></label>
        <label>Max tokens <input id="set-max_tokens" type="number" step="256" min="256"></label>
        <label>Max agent iterations <input id="set-max_react_iterations" type="number" step="1" min="1" max="200"></label>
      </div>
      <label>System prompt <textarea id="set-system_prompt" rows="3"></textarea></label>
      <div class="group-label">REASONING</div>
      <div class="tools-box">
        <label class="chk"><input type="checkbox" id="set-thinking"> enable thinking — model drafts reasoning first (extra tokens per turn)</label>
      </div>
      <div class="group-label">CONTEXT</div>
      <div class="tools-box">
        <label class="chk"><input type="checkbox" id="set-compact"> auto-compact long threads — summarize old messages before the model re-reads them</label>
      </div>
      <div class="row">
        <label>Compact past ~tokens <input id="set-compact_trigger_tokens" type="number" step="1000" min="0" title="0 disables"></label>
        <label>Keep newest msgs <input id="set-compact_keep_messages" type="number" step="1" min="4"></label>
        <label>Summary tokens <input id="set-compact_summary_tokens" type="number" step="100" min="100"></label>
      </div>
      <div class="group-label">MULTIMODAL</div>
      <div class="tools-box">
        <label class="chk"><input type="checkbox" id="set-vision"> model supports vision (image paste / attach)</label>
      </div>
      <div class="group-label">LOCAL TOOLS</div>
      <div id="set-tools" class="tools-box"></div>
      <label>MCP servers (JSON — add <code>"disabled": true</code> to park one) <textarea id="set-mcp" rows="8" spellcheck="false"></textarea></label>
      <div class="row end">
        <button id="btn-cancel" class="btn ghost">CANCEL</button>
        <button id="btn-save" class="btn accent">SAVE</button>
      </div>
      <div id="settings-error" class="error hidden"></div>
    </div>
  </div>

  <div id="game-overlay" class="hidden">
    <div id="game-frame">
      <canvas id="game-canvas" width="1680" height="960"></canvas>
      <div id="game-bar">
        <span class="g-title">X-SIM // STAGE X-01</span>
        <span class="g-keys">←→/AD RUN · SPACE JUMP · X DASH · Z BLASTER · WALL-KICK: JUMP OFF WALLS · R RESTART · ESC EXIT</span>
        <button id="btn-game-close" class="btn ghost">✕ ESC</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/sfx.js"></script>
<script src="/static/game.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
